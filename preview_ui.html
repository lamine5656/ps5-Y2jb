<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Apercu UI - Y2JB Autoloader L92</title>
<style>
    body { background:#000; margin:0; padding:0; font-family:Arial, sans-serif; }
    #root { position:relative; width:1920px; height:1080px; transform-origin: top left; }
    @keyframes nlFadeIn { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform:none;} }
    @keyframes nlGlow { 0%,100% { text-shadow: 0 0 24px rgba(0,229,255,.85), 0 0 60px rgba(0,229,255,.35);} 50% { text-shadow: 0 0 30px rgba(255,43,214,.85), 0 0 70px rgba(255,43,214,.40);} }
    @keyframes nlPulse { 0%,100% { opacity:1; transform: scale(1);} 50% { opacity:.35; transform: scale(.7);} }
    @keyframes nlShimmer { 0% { background-position: 0% 0;} 100% { background-position: 300% 0;} }
    @keyframes nlDriftA { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(120px,-80px) scale(1.15);} }
    @keyframes nlDriftB { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(-140px,90px) scale(1.1);} }
    @keyframes nlScan { 0% { top:-15%;} 100% { top:115%;} }
    .nl_glass { background:rgba(6,10,26,.72); border:1px solid rgba(0,229,255,.35); border-radius:18px; box-shadow:0 0 34px rgba(0,229,255,.18), inset 0 0 60px rgba(0,229,255,.04); }
    .nl_entry { animation:nlFadeIn .25s ease-out; }
</style>
</head>
<body>
<div id="root">
    <div id="nl_bg" style="position:absolute; inset:0; background-image:url('src/background.png'); background-size:cover; background-position:center;"></div>
    <div id="nl_vignette" style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(2,3,16,.78) 0%, rgba(2,3,16,.42) 45%, rgba(2,3,16,.85) 100%);"></div>
    <div style="position:absolute; top:60px; left:-100px; width:820px; height:820px; border-radius:50%; background:radial-gradient(circle, rgba(0,229,255,.22) 0%, rgba(0,229,255,0) 65%); animation:nlDriftA 14s ease-in-out infinite;"></div>
    <div style="position:absolute; bottom:-160px; right:-120px; width:900px; height:900px; border-radius:50%; background:radial-gradient(circle, rgba(255,43,214,.20) 0%, rgba(255,43,214,0) 65%); animation:nlDriftB 17s ease-in-out infinite;"></div>
    <div style="position:absolute; left:0; width:100%; height:14%; background:linear-gradient(180deg, rgba(0,229,255,0) 0%, rgba(0,229,255,.05) 50%, rgba(0,229,255,0) 100%); animation:nlScan 9s linear infinite;"></div>

    <div style="position:absolute; top:64px; left:50%; transform:translateX(-50%); width:118px; height:118px; border-radius:50%; background-image:url('src/icon0.png'); background-size:cover; background-position:center; border:2px solid rgba(0,229,255,.65); box-shadow:0 0 40px rgba(0,229,255,.45), inset 0 0 28px rgba(0,0,0,.55);"></div>

    <div style="position:absolute; top:196px; left:0; width:100%; text-align:center; font-weight:bold; color:#eaf6ff; font-size:74px; letter-spacing:14px; animation:nlGlow 4s ease-in-out infinite;">Y2JB AUTOLOADER</div>

    <div id="chip" class="nl_glass" style="position:absolute; top:316px; left:50%; transform:translateX(-50%); padding:12px 56px; border-radius:30px; background:rgba(6,10,26,.8); border:1px solid rgba(0,229,255,.5); color:#9fe8ff; font-size:26px; letter-spacing:3px;">
        INITIALISATION...
        <div id="dot" style="position:absolute; left:20px; top:50%; margin-top:-7px; width:14px; height:14px; border-radius:50%; background:#00e5ff; box-shadow:0 0 14px rgba(0,229,255,.9); animation:nlPulse 1.4s ease-in-out infinite;"></div>
    </div>

    <div class="nl_glass" style="position:absolute; top:400px; left:50%; transform:translateX(-50%); width:940px; height:440px; color:#9fb3d1; font-family:monospace; font-size:24px; overflow:hidden; padding:10px 0;">
        <div id="log" style="position:absolute; bottom:0; left:0; width:100%; padding:14px 22px; box-sizing:border-box;"></div>
    </div>

    <div class="nl_glass" style="position:absolute; top:876px; left:50%; transform:translateX(-50%); width:940px; height:64px; overflow:hidden; border-radius:18px;">
        <div id="bar" style="width:100%; height:100%; background:linear-gradient(90deg, #00e5ff, #7aa8ff, #ff2bd6, #00e5ff); background-size:300% 100%; transform-origin:left; transform:scaleX(0); opacity:.92; animation:nlShimmer 3.5s linear infinite;"></div>
        <div id="label" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:28px; font-weight:bold; letter-spacing:2px; text-shadow:0 0 12px rgba(0,0,0,.9), 0 0 24px rgba(0,229,255,.5);">LOADING...</div>
    </div>
    <div id="pct" style="position:absolute; top:896px; left:0; width:100%; text-align:center; color:#7dd7ff; font-size:22px; letter-spacing:4px;">0%</div>

    <div style="position:absolute; bottom:26px; left:0; width:100%; text-align:center; color:rgba(159,179,209,.65); font-size:20px; letter-spacing:2px;">by PLK &bull; fork of Y2JB by Gezine &bull; apercu L92</div>
</div>

<script>
    const root = document.getElementById('root');
    function fit(){ root.style.transform = 'scale(' + Math.min(innerWidth/1920, innerHeight/1080) + ')'; }
    fit(); onresize = fit;

    const messages = [
        ["Y2JB Autoloader v1.1.0 by PLK", "success"],
        ["Initialising autoloader scene...", "warning"],
        ["Initialised worker thread, reading initial data", "info"],
        ["Initialised WebShell, reading user scripts", "info"],
        ["Boot Stage 1 completed", "success"],
        ["Disabling PSN dialog and YouTube splash...", "info"],
        ["Disabling YouTube splash screen...", "info"],
        ["Checking /user/download/PPSA01650 for updates...", "info"],
        ["Found y2jb_update.zip (v1.1.0). Extracting...", "warning"],
        ["Extending internal array with buffer allocated of size 0x10000", "info"],
        ["Data copied successfully", "success"],
        ["Icon updated successfully at: /user/appmeta/PPSA01650/icon0.png", "success"],
        ["Loading autoload scenaries...", "info"],
        ["Starting Kernel Exploit...", "warning"]
    ];
    let i = 0;
    const log = document.getElementById('log');
    (function next(){
        if (i >= messages.length) return;
        const [msg, type] = messages[i++];
        const e = document.createElement('div');
        e.className = 'nl_entry';
        e.style.marginBottom = '6px';
        if (type === 'success') { e.style.color = '#7dff8a'; e.style.textShadow = '0 0 12px rgba(125,255,138,.4)'; }
        else if (type === 'error') { e.style.color = '#ff4d6d'; }
        else if (type === 'warning') { e.style.color = '#ffd166'; }
        else { e.style.color = '#9fb3d1'; }
        e.textContent = '\u00BB ' + msg;
        log.appendChild(e);
        setTimeout(next, 750);
    })();

    let p = 0;
    setInterval(() => {
        p = Math.min(100, p + 4);
        document.getElementById('bar').style.transform = 'scaleX(' + p/100 + ')';
        document.getElementById('pct').textContent = p + '%';
        if (p >= 100) { document.getElementById('label').textContent = 'COMPLETE'; document.getElementById('dot').style.background = '#7dff8a'; }
    }, 900);
</script>
</body>
</html>
